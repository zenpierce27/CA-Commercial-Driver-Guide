<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>CDL Study — CA Class A</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; }
  body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  .safe-top { padding-top: env(safe-area-inset-top); }
</style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
<div id="app" class="min-h-full flex flex-col">
  <header class="safe-top sticky top-0 z-10 bg-slate-900/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <button id="home-btn" class="flex items-center gap-2 font-semibold text-sm">
        <span class="text-amber-400">CDL</span><span>Study</span>
      </button>
      <div id="header-right" class="text-xs text-slate-400"></div>
    </div>
  </header>
  <main id="view-root" class="flex-1 max-w-3xl w-full mx-auto px-4 py-6"></main>
  <footer class="safe-bottom border-t border-slate-800 bg-slate-900/80">
    <div class="max-w-3xl mx-auto px-4 py-2 text-[11px] text-slate-500 text-center">
      CA Class A — Source: DL-650 + 2023 Modernized Supplement
    </div>
  </footer>
</div>
<script type="module" src="js/main.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err));
    });
  }
</script>
</body>
</html>
